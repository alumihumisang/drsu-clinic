<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 120" fill="none">
  <defs>
    <!-- Every wing uses this complete outline and matching outer flourish. -->
    <g id="wing" stroke="#a184ae" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 0 C-19 -10 -37 -8 -54 4 C-40 22 -18 22 0 0 Z"/>
      <path d="M-58 -7 C-37 -15 -18 -15 0 -5"/>
    </g>
  </defs>
  <!-- Equal-sized upper pair; the same shape at 72% size for the lower pair. -->
  <use href="#wing" transform="translate(65 54) rotate(24)"/>
  <use href="#wing" transform="translate(75 54) scale(-1 1) rotate(24)"/>
  <use href="#wing" transform="translate(65 64) rotate(-62) scale(.72)"/>
  <use href="#wing" transform="translate(75 64) scale(-1 1) rotate(-62) scale(.72)"/>
</svg>
